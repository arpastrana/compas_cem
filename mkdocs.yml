site_name: COMPAS CEM
site_url: https://arpastrana.github.io/compas_cem/
site_description: The Combinatorial Equilibrium Modeling (CEM) framework for COMPAS.
site_author: Rafael Pastrana

repo_name: arpastrana/compas_cem
repo_url: https://github.com/arpastrana/compas_cem/

copyright: Copyright &copy; Rafael Pastrana

exclude_docs: |
  migration/

extra:
  homepage: https://arpastrana.github.io/compas_cem/
  version:
    provider: mike

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/css/custom.css

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - toc:
      permalink: "¤"

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://compas.dev/compas/latest/objects.inv
          options:
            allow_inspection: true
            backlinks: false
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: numpy
            docstring_section_style: list
            filters: public
            group_by_category: true
            heading_level: 1
            inherited_members: false
            line_length: 88
            merge_init_into_class: true
            modernize_annotations: true
            parameter_headings: false
            preload_modules: [mkdocstrings, compas]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_modules: false
            show_if_no_docstring: false
            show_inheritance_diagram: false
            show_root_heading: true
            show_root_full_path: true
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: true
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary:
              modules: false
            type_parameter_headings: true
            unwrap_annotated: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Examples:
      - Overview: examples.md
      - Python:
          - 01. Simple Compression Structure: examples/python/01_simple_compression_structure.md
          - 02. Braced Tower in 2D: examples/python/02_braced_tower_2d.md
          - 03. Bridge Optimization in 2D: examples/python/03_bridge_2d.md
          - 04. Tree Structure in 2D: examples/python/04_tree_2d.md
          - 05. Planar Tensegrity Wheel: examples/python/05_tensegrity_wheel_2d.md
      - Grasshopper:
          - A. Bridge in 2D: examples/grasshopper/bridge_2d.md
          - B. Tubular Bridge in 3D: examples/grasshopper/bridge_3d.md
          - C. Circular Dome: examples/grasshopper/dome.md
          - D. Jessen Tensegrity: examples/grasshopper/jessen_tensegrity.md
          - E. Spiral Staircase: examples/grasshopper/spiral_staircase.md
  - API Reference:
      - compas_cem: api/compas_cem.md
      - compas_cem.diagrams: api/compas_cem.diagrams.md
      - compas_cem.elements: api/compas_cem.elements.md
      - compas_cem.loads: api/compas_cem.loads.md
      - compas_cem.supports: api/compas_cem.supports.md
      - compas_cem.equilibrium: api/compas_cem.equilibrium.md
      - compas_cem.optimization: api/compas_cem.optimization.md
      - compas_cem.plotters: api/compas_cem.plotters.md
      - compas_cem.viewers: api/compas_cem.viewers.md
      - compas_cem.ghpython: api/compas_cem.ghpython.md
  - Changelog: changelog.md
  - Citing: citing.md
  - License: license.md
