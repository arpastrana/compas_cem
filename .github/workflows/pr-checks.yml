name: verify-pr-checklist
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

# Cancel a PR's in-flight checks when new commits are pushed to it. This
# workflow is pull_request-only, so cancelling is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check Actions
    runs-on: ubuntu-latest
    steps:
      # The `no changelog` label skips the check, as the third-party checker this replaces did.
      - name: Changelog check
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if ! grep -qx CHANGELOG.md <<< "$files"; then
            echo "::error::Add an entry to CHANGELOG.md, or label the pull request 'no changelog'."
            exit 1
          fi

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
