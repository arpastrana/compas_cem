name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel a PR's in-flight run when new commits are pushed to it. Every other
# event gets a run-unique group, so a stuck run never holds up a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions.docs@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          generator: mkdocs
          extras: dev

  # compas-actions.docs only deploys mkdocs on a version tag, so main would
  # otherwise never reach the site. Its sphinx path published main to `latest/`.
  dev-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and the docs toolchain
        # mkdocstrings imports the package to render the API pages.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Deploy the dev docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push --update-aliases dev
