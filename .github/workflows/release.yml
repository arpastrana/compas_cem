name: release

on:
  push:
    tags:
      - 'v*'
  # A manual run rehearses the yak push against the test server, with no PyPI upload or release.
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # compas-actions.build skips macOS with Python 3.9, so that cell would pass untested.
        exclude:
          - os: macos-latest
            python: "3.9"

    steps:
      - uses: compas-dev/compas-actions.build@v5
        with:
          python: ${{ matrix.python }}
          invoke_lint: true
          invoke_test: true
          check_import: true

  publish:
    needs: build
    # windows-latest, not ubuntu: the componentizer loads GH_IO.dll.
    runs-on: windows-latest
    steps:
      - uses: compas-dev/compas-actions.publish@v3
        with:
          pypi_token: ${{ secrets.PYPI }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_ghpython_components: true
          gh_source: src/compas_cem/ghpython/components_cpython
          gh_target: src/compas_cem/ghpython/components_cpython/ghuser
          gh_interpreter: "cpython"
          release_name_prefix: COMPAS CEM
          publish_to_pypi: ${{ github.event_name == 'push' }}
          create_release: ${{ github.event_name == 'push' }}
      # The action has already built the components and uploaded to PyPI, which the components' header needs.
      - name: Build the yak package
        shell: bash
        run: invoke yakerize
      - name: Push the yak package
        shell: bash
        run: invoke publish-yak --yak-file dist/yak_package/*.yak ${{ github.event_name != 'push' && '--test-server' || '' }}
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
