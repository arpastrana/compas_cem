name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: compas-dev/compas-actions.build@v5
        with:
          python: ${{ matrix.python }}
          invoke_lint: true
          invoke_test: true
          check_import: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Rhino 8 yak packaging and CPython Grasshopper components attach here (Phase 5).
      - uses: compas-dev/compas-actions.publish@v3
        with:
          pypi_token: ${{ secrets.PYPI }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_name_prefix: COMPAS CEM
